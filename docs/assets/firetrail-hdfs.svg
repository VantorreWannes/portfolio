<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 260"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Firetrail HDFS benchmark</title>
  <desc id="desc">
    Encoding speed: Firetrail Orange 2.42 GB/s, lz4 1.25 GB/s,
    zstd 1.21 GB/s. Compressed size: Firetrail Orange 624 MB,
    lz4 348 MB, zstd 246 MB.
  </desc>

  <rect width="640" height="260" rx="12" fill="#14161c"/>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#a6adbb">
    <text x="24" y="30" fill="#edf0f5" font-size="14" font-weight="600">
      HDFS · 1.58 GB input
    </text>

    <text x="160" y="64">Encode · GB/s ↑</text>
    <text x="400" y="64">Output · MB ↓</text>

    <text x="24" y="104" fill="#fb923c">Orange</text>
    <text x="24" y="148">lz4</text>
    <text x="24" y="192">zstd</text>

    <g fill="#222630">
      <rect x="160" y="86" width="170" height="24" rx="4"/>
      <rect x="160" y="130" width="170" height="24" rx="4"/>
      <rect x="160" y="174" width="170" height="24" rx="4"/>
      <rect x="400" y="86" width="170" height="24" rx="4"/>
      <rect x="400" y="130" width="170" height="24" rx="4"/>
      <rect x="400" y="174" width="170" height="24" rx="4"/>
    </g>

    <g fill="#fb923c">
      <rect x="160" y="86" width="164.56" height="24" rx="4"/>
      <rect x="400" y="86" width="163.2" height="24" rx="4"/>
    </g>

    <g fill="#626d82">
      <rect x="160" y="130" width="85" height="24" rx="4"/>
      <rect x="160" y="174" width="82.28" height="24" rx="4"/>
      <rect x="400" y="130" width="91.02" height="24" rx="4"/>
      <rect x="400" y="174" width="64.34" height="24" rx="4"/>
    </g>

    <g fill="#edf0f5" font-weight="600">
      <text x="342" y="104">2.42</text>
      <text x="342" y="148">1.25</text>
      <text x="342" y="192">1.21</text>
      <text x="582" y="104">624</text>
      <text x="582" y="148">348</text>
      <text x="582" y="192">246</text>
    </g>

    <text x="24" y="238" font-size="11">
      Ryzen 7 7800X3D · Single thread · lz4 --fast=20 · zstd --fast=5
    </text>
  </g>
</svg>