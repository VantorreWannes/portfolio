<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 220"
     role="img"
     aria-labelledby="title desc">
  <title id="title">The LaP spec: eight primitives, one operator, frozen</title>
  <desc id="desc">
    Labels and Primitives has exactly eight primitives and one operator.
    The spec is frozen. Only compilers and tooling may change.
  </desc>

  <rect width="640" height="220" rx="12" fill="#14161c"/>

  <g font-family="system-ui, sans-serif">
    <text x="24" y="32" fill="#edf0f5" font-size="16" font-weight="600">
      LaP · the whole language
    </text>
    <text x="616" y="32" text-anchor="end" fill="#a6adbb" font-size="11">
      frozen · unchangeable
    </text>

    <!-- Row 1 -->
    <g>
      <rect x="24" y="56" width="140" height="60" rx="6" fill="#222630"/>
      <text x="94" y="82" text-anchor="middle" fill="#edf0f5" font-size="16" font-weight="700">BIT</text>
      <text x="94" y="102" text-anchor="middle" fill="#a6adbb" font-size="10">data</text>
    </g>
    <g>
      <rect x="172" y="56" width="140" height="60" rx="6" fill="#222630"/>
      <text x="242" y="82" text-anchor="middle" fill="#fb923c" font-size="16" font-weight="700">NAND</text>
      <text x="242" y="102" text-anchor="middle" fill="#a6adbb" font-size="10">the only operator</text>
    </g>
    <g>
      <rect x="320" y="56" width="140" height="60" rx="6" fill="#222630"/>
      <text x="390" y="82" text-anchor="middle" fill="#edf0f5" font-size="16" font-weight="700">BRANCH</text>
      <text x="390" y="102" text-anchor="middle" fill="#a6adbb" font-size="10">control</text>
    </g>
    <g>
      <rect x="468" y="56" width="140" height="60" rx="6" fill="#222630"/>
      <text x="538" y="82" text-anchor="middle" fill="#edf0f5" font-size="13" font-weight="700">[item, ...]</text>
      <text x="538" y="102" text-anchor="middle" fill="#a6adbb" font-size="10">collection</text>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="24" y="128" width="140" height="60" rx="6" fill="#222630"/>
      <text x="94" y="152" text-anchor="middle" fill="#edf0f5" font-size="12" font-weight="700">(...) Type { }</text>
      <text x="94" y="172" text-anchor="middle" fill="#a6adbb" font-size="10">function</text>
    </g>
    <g>
      <rect x="172" y="128" width="140" height="60" rx="6" fill="#222630"/>
      <text x="242" y="152" text-anchor="middle" fill="#edf0f5" font-size="13" font-weight="700">label = ...</text>
      <text x="242" y="172" text-anchor="middle" fill="#a6adbb" font-size="10">assignment</text>
    </g>
    <g>
      <rect x="320" y="128" width="140" height="60" rx="6" fill="#222630"/>
      <text x="390" y="152" text-anchor="middle" fill="#edf0f5" font-size="16" font-weight="700">*label</text>
      <text x="390" y="172" text-anchor="middle" fill="#a6adbb" font-size="10">reference</text>
    </g>
    <g>
      <rect x="468" y="128" width="140" height="60" rx="6" fill="#222630"/>
      <text x="538" y="152" text-anchor="middle" fill="#edf0f5" font-size="15" font-weight="700">EXTERN</text>
      <text x="538" y="172" text-anchor="middle" fill="#a6adbb" font-size="10">external</text>
    </g>
  </g>
</svg>
